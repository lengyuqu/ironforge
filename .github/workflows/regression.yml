name: Regression

# Where this runs:
#   * git233 (Gitea Actions) is the day-to-day CI: CNB's runner quota is used up
#     and GitHub's free minutes are scarce. Its runners reach crates.io and
#     docker.gitea.com but not GitHub or Docker Hub, which the jobs below account
#     for (vendored Swagger UI; `vars.POSTGRES_IMAGE` / `vars.MYSQL_IMAGE`; an
#     unreachable advisory database is a warning there).
#   * GitHub is the release-time check only: the repository is pushed there when
#     releasing, so `pull_request` never fires on GitHub in practice.
#
# How much runs:
#   * Pull requests run a scoped set. The `changes` job (scripts/ci-changes.py)
#     classifies the files changed against the merge base: docs only -> nothing;
#     web/ only -> the frontend job; changes confined to rg-ci / rg-ssh /
#     rg-runner / rg-cli / rg-ci-isolation / rg-http / rg-mcp -> clippy and the
#     tests of those crates and of the crates that depend on them (read from
#     the Cargo manifests).
#   * Everything runs on `push` to main, `workflow_dispatch` and the nightly
#     schedule, and on a pull request that touches rg-core / rg-db / rg-git,
#     Cargo.toml / Cargo.lock, .github/, scripts/, deploy/ or any file the
#     script does not recognise. If the script cannot work out the scope it
#     says so (`::warning::`) and runs everything. Jobs the scope leaves out
#     are skipped, not green-by-default steps.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly full run (Gitea Actions; the `changes` job skips it on GitHub).
    - cron: "17 3 * * *"

# Runners are pinned to a concrete image instead of `ubuntu-latest`: GitHub is
# moving that label to Ubuntu 26, and a toolchain/OS change should arrive as a
# reviewed commit rather than as a surprise red build. Move the pin on purpose.
# The JavaScript actions below are on majors that run on Node 24 (the earlier
# ones ran on Node 20, which GitHub is retiring).
env:
  CARGO_INCREMENTAL: "0"

jobs:
  # Works out what the other jobs need to run (see the header comment). It is
  # cheap: a checkout and a stdlib-only Python script, no toolchain.
  changes:
    name: Decide the test scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A scheduled run on GitHub would spend the scarce free minutes for nothing:
    # the nightly run belongs to git233. Skipping this job skips the rest.
    if: github.event_name != 'schedule' || github.server_url != 'https://github.com'
    outputs:
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      db_smoke: ${{ steps.scope.outputs.db_smoke }}
      git_protocol: ${{ steps.scope.outputs.git_protocol }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - name: Checkout (full history, to find the merge base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
              || echo "::warning::could not fetch ${BASE_REF}; the scope falls back to everything"
            base="origin/${BASE_REF}"
          fi
          command -v python3 >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y python3; } || true
          # Fail closed: if the script cannot run at all, run everything.
          if ! python3 scripts/ci-changes.py --event "$EVENT_NAME" --base "$base"; then
            echo "::warning::scripts/ci-changes.py failed; running everything"
            {
              echo "full=true"
              echo "rust=true"
              echo "frontend=true"
              echo "db_smoke=true"
              echo "git_protocol=true"
              echo "packages="
            } >> "$GITHUB_OUTPUT"
          fi

  # Gates are split into separate jobs on purpose. When several gates live in
  # one job, a failure in an early step makes GitHub skip the remaining steps —
  # a red clippy used to hide every Rust test result, and a red i18n check hid
  # `svelte-check` and the frontend build.
  clippy:
    name: Clippy (deny warnings)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The tree is rustfmt-clean (baseline commit); keep it that way so a
      # well-meant `cargo fmt --all` never turns into a 100-file surprise.
      - name: Formatting (rustfmt)
        run: cargo fmt --all --check

      # Always the whole workspace, even for a scoped run: it takes minutes, and
      # a lint in an untouched crate that a changed one now trips is still red.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust tests and migration smoke
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # No separate `cargo check --workspace --tests`: it compiled everything
      # once for metadata only (about 6 minutes in the logs) and `cargo test`
      # then compiled it again. A compile error fails the test step just as well,
      # and the clippy job already type-checks every target.
      # rg-http is part of the workspace, so it runs here once. A separate
      # `cargo test -p rg-http` step used to run it a second time and, with the
      # growth of the integration suites, pushed the job past its time limit.
      # A full run tests the workspace; a scoped pull request tests the changed
      # crates and the ones that depend on them (`packages` is `-p a -p b`).
      - name: Run workspace tests
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$PACKAGES" ]; then
            cargo test --workspace -- --nocapture
          else
            echo "scoped run: ${PACKAGES}"
            cargo test ${PACKAGES} -- --nocapture
          fi

      - name: Fresh DB migration smoke
        run: |
          db_path="${RUNNER_TEMP}/ironforge-ci-migration.db"
          cargo run -p rg-cli -- migrate --db-url "sqlite://${db_path}?mode=rwc"

  security-audit:
    name: Security audit
    needs: changes
    # Only a changed Cargo.lock changes the answer, and that is a full run.
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        shell: bash
        run: |
          # The advisory database lives on GitHub. A runner that cannot reach it
          # (git233's) cannot audit: say so loudly instead of failing every run,
          # but only off GitHub - on GitHub an unreachable database is a failure.
          set +e
          cargo audit 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] \
             && grep -q "couldn't fetch advisory database" audit.log \
             && [ "${GITHUB_SERVER_URL}" != "https://github.com" ]; then
            echo "::warning::advisory database unreachable from this runner - the audit did NOT run"
            exit 0
          fi
          exit $status

  git-protocol:
    name: Real Git client protocol matrix
    needs: changes
    if: needs.changes.outputs.git_protocol == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git openssh-client curl python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build IronForge
        run: cargo build -p rg-cli

      - name: Run HTTP and SSH protocol matrix
        env:
          IRONFORGE_BIN: ${{ github.workspace }}/target/debug/ironforge
        run: scripts/git-protocol-e2e.sh

  postgres-smoke:
    name: PostgreSQL migration, CRUD and FTS smoke
    needs: changes
    if: needs.changes.outputs.db_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub is unreachable from git233's runners: set the repository
        # variable POSTGRES_IMAGE to a mirror there; GitHub uses the default.
        image: ${{ vars.POSTGRES_IMAGE || 'postgres:17' }}
        env:
          POSTGRES_USER: ironforge
          POSTGRES_PASSWORD: ironforge
          POSTGRES_DB: ironforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironforge -d ironforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # On GitHub the job runs on the VM and the service is published on
      # 127.0.0.1. On Gitea Actions the job runs in a container on the service's
      # network and the service is reached by its name; 127.0.0.1 times out.
      - name: Locate the database service
        run: |
          host=127.0.0.1
          if getent hosts postgres >/dev/null 2>&1; then host=postgres; fi
          echo "IRONFORGE_TEST_DATABASE_URL=postgres://ironforge:ironforge@${host}:5432/ironforge" >> "$GITHUB_ENV"
          echo "database host: ${host}"

      - name: Run PostgreSQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -- --ignored --nocapture

  mysql-smoke:
    name: MySQL migration, CRUD and FTS smoke
    needs: changes
    if: needs.changes.outputs.db_smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: ${{ vars.MYSQL_IMAGE || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ironforge
          MYSQL_USER: ironforge
          MYSQL_PASSWORD: ironforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uironforge -pironforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The FTS migration creates triggers. With binary logging on (the MySQL
      # 8.4 default) the server refuses that for a non-SUPER user (error 1419)
      # unless log_bin_trust_function_creators is set. Production MySQL needs
      # the same setting, or a migration user with SUPER.
      # Host: see the PostgreSQL job. The runner image has no `mysql` client.
      - name: Locate the database service
        run: |
          host=127.0.0.1
          if getent hosts mysql >/dev/null 2>&1; then host=mysql; fi
          echo "MYSQL_HOST=${host}" >> "$GITHUB_ENV"
          echo "IRONFORGE_TEST_DATABASE_URL=mysql://ironforge:ironforge@${host}:3306/ironforge" >> "$GITHUB_ENV"
          echo "database host: ${host}"

      - name: Install the MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client-core-8.0

      - name: Allow trigger creation with binary logging
        run: mysql -h "${MYSQL_HOST}" -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Run MySQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -- --ignored --nocapture

  frontend:
    name: Frontend check and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: `svelte-check` and the production build are the primary
      # signals, so they run before the i18n contract check (which used to sit
      # first and hide both of them when it failed).
      - name: Svelte check
        run: pnpm run check

      - name: Frontend unit tests (vitest)
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

      - name: i18n key contract check
        run: node ../scripts/i18n-key-check.mjs

  deploy-config:
    name: Docker compose config
    needs: changes
    # deploy/ is on the full-run list, so this runs exactly when it could change.
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate main compose
        run: |
          cp deploy/.env.example deploy/.env
          secret="$(openssl rand -hex 32)"
          sed -i "s/^IRONFORGE_JWT_SECRET=.*/IRONFORGE_JWT_SECRET=${secret}/" deploy/.env
          docker compose -f deploy/docker-compose.yml config >/tmp/ironforge-compose-main.yml
          rm -f deploy/.env

      - name: Validate observability compose
        run: docker compose -f deploy/docker-compose.observability.yml config >/tmp/ironforge-compose-observability.yml
