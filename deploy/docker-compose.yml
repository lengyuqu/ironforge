# IronForge Docker Compose
#
# Quick start (run from the repo root):
#   1. cp ironforge.example.toml ironforge.toml  # edit as needed
#   2. docker compose -f deploy/docker-compose.yml up -d
#
# For observability (Prometheus + Grafana + Alertmanager):
#   docker compose -f deploy/docker-compose.observability.yml up -d

services:
  ironforge:
    build:
      # Context is the repo root (this file lives in deploy/), where the
      # Dockerfile and crates/ live.
      context: ..
      dockerfile: Dockerfile
    container_name: ironforge
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "2222:2222"   # SSH
    volumes:
      # Persistent data (repos, DB, logs)
      - ironforge-data:/data
      # Config file (optional — mount your ironforge.toml here)
      # - ./ironforge.toml:/app/ironforge.toml:ro
      # SSH host key (persist to avoid key change on restart)
      # - ./ssh_host_key:/app/ssh_host_key:ro
    environment:
      # JWT secret (REQUIRED — change this in production)
      - IRONFORGE_JWT_SECRET=change-me-in-production
      # Optional: SMTP settings
      # - IRONFORGE_SMTP_HOST=smtp.example.com
      # - IRONFORGE_SMTP_PORT=587
      # - IRONFORGE_SMTP_USER=noreply@example.com
      # - IRONFORGE_SMTP_PASS=your-password
      # - IRONFORGE_SMTP_FROM=IronForge <noreply@example.com>
    # Uncomment to use config file instead of env vars:
    # command: >
    #   ironforge serve
    #   --config /app/ironforge.toml

  # ── Optional: CI Runner ─────────────────────────────────
  # runner:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ironforge-runner
  #   restart: unless-stopped
  #   command: >
  #     ironforge runner
  #     --server http://ironforge:8080
  #     --name docker-runner
  #   environment:
  #     - IRONFORGE_RUNNER_TOKEN=your-runner-token
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock  # for Docker CI jobs
  #     - ironforge-data:/data
  #   depends_on:
  #     - ironforge

volumes:
  ironforge-data:
    driver: local
