[package]
name = "rg-git"
version = "0.4.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
tracing = { workspace = true }
gix = { workspace = true }
# Direct dep so the shared gix-archive instance gets tar/tar_gz/zip enabled
# (gix itself pulls gix-archive with default-features = false; features are
# unified across the graph, which turns on the formats in `ops::archive`).
gix-archive = { version = "0.39", default-features = false, features = [
    "tar",
    "tar_gz",
    "zip",
] }
# Pack generation pipeline (count + entry + bytes output) is gated behind
# the `generate` feature; gix does not enable it by default.
gix-pack = { version = "0.77", features = ["generate"] }
thiserror = { workspace = true }
# Secret scanning patterns (R7). `regex 1.12.3` is already in `Cargo.lock`
# (pulled in transitively), so this only promotes it to a direct dependency —
# no new crate enters the graph. The workspace does not declare `regex`, so the
# version requirement is spelled out here rather than via `workspace = true`.
regex = "1"

[dev-dependencies]
walkdir = "2"
tempfile = "3"
