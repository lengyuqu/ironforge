# CNB pipelines. CNB is the development upstream (CLAUDE.md, "仓库分工与推送顺序"),
# so this file carries every gate of .github/workflows/regression.yml except the
# PostgreSQL/MySQL smoke jobs (see below). GitHub Actions stays the
# release-time check only; its free minutes are scarce.
#
# Gate map (GitHub job -> CNB pipeline):
#   clippy (+rustfmt)        -> lint
#   rust-tests               -> rust-tests
#   security-audit           -> security-audit
#   git-protocol             -> git-protocol
#   postgres-smoke, mysql-smoke -> not run in CNB. Run them locally with
#                               scripts/ci-db-tests.sh postgres|mysql (needs Docker)
#                               when a change touches SQL, migrations or the
#                               collaboration store; every-commit runs are not worth it.
#   frontend                 -> frontend
#   deploy-config            -> deploy-config
#
# Each list item is an independent pipeline and runs in parallel. See the
# trigger section at the bottom: only `lint` is automatic.

.rust-setup: &rust-setup
  docker:
    image: rust:1
    # Node-local build caches shared by all pipelines of this repository.
    volumes:
      - cargo-registry:/root/.cargo/registry:copy-on-write
      - cargo-git:/root/.cargo/git:copy-on-write
      - cargo-target:./target:copy-on-write
  env:
    CARGO_INCREMENTAL: "0"

.apt-deps: &apt-deps
  name: system dependencies
  script: |
    apt-get update
    apt-get install -y --no-install-recommends pkg-config libssl-dev libsqlite3-dev git

.lint: &lint
  <<: *rust-setup
  name: lint
  stages:
    - *apt-deps
    - name: rustfmt and clippy components
      script: rustup component add rustfmt clippy
    - name: cargo fmt --check
      script: cargo fmt --all --check
    - name: clippy (deny warnings)
      script: cargo clippy --workspace --all-targets -- -D warnings

.rust-tests: &rust-tests
  <<: *rust-setup
  name: rust-tests
  stages:
    - *apt-deps
    - name: workspace tests compile
      script: cargo check --workspace --tests
    - name: workspace tests
      script: cargo test --workspace
    - name: fresh DB migration smoke
      script: cargo run -p rg-cli -- migrate --db-url "sqlite:///tmp/ironforge-cnb-migration.db?mode=rwc"

.security-audit: &security-audit
  <<: *rust-setup
  name: security-audit
  stages:
    - name: install cargo-audit
      script: cargo install cargo-audit --locked
    - name: cargo audit
      script: cargo audit

.git-protocol: &git-protocol
  <<: *rust-setup
  name: git-protocol
  stages:
    - name: system dependencies
      script: |
        apt-get update
        apt-get install -y --no-install-recommends pkg-config libssl-dev libsqlite3-dev git openssh-client openssl curl python3
    - name: build IronForge
      script: cargo build -p rg-cli
    - name: HTTP and SSH protocol matrix
      script: IRONFORGE_BIN="$PWD/target/debug/ironforge" scripts/git-protocol-e2e.sh

.frontend: &frontend
  name: frontend
  docker:
    image: node:22
  stages:
    - name: install pnpm
      script: npm install -g pnpm@11
    - name: install dependencies
      script: cd web && pnpm install --frozen-lockfile
    # svelte-check and the build are the primary signals; the i18n contract
    # check runs last so it cannot hide them.
    - name: svelte check
      script: cd web && pnpm run check
    - name: unit tests (vitest)
      script: cd web && pnpm run test
    - name: build
      script: cd web && pnpm run build
    - name: i18n key contract check
      script: node scripts/i18n-key-check.mjs

.deploy-config: &deploy-config
  name: deploy-config
  services:
    - docker
  docker:
    image: docker:cli
  stages:
    - name: tools
      script: apk add --no-cache openssl
    - name: validate main compose
      script: |
        cp deploy/.env.example deploy/.env
        secret="$(openssl rand -hex 32)"
        sed -i "s/^IRONFORGE_JWT_SECRET=.*/IRONFORGE_JWT_SECRET=${secret}/" deploy/.env
        docker compose -f deploy/docker-compose.yml config >/tmp/ironforge-compose-main.yml
        rm -f deploy/.env
    - name: validate observability compose
      script: docker compose -f deploy/docker-compose.observability.yml config >/tmp/ironforge-compose-observability.yml

# Automatic: only the cheap `lint` gate (rustfmt + clippy) on push and PR.
# The full gate set is MANUAL: it takes ~20 minutes and should be started on
# purpose, e.g. before merging a PR:
#   cnb build start-build --repo zdzso/ironforge --branch <branch> --event api_trigger
# or from the repository page (custom button / web_trigger).
main:
  push:
    - *lint
  pull_request:
    - *lint
  api_trigger: &all-gates
    - *lint
    - *rust-tests
    - *security-audit
    - *git-protocol
    - *frontend
    - *deploy-config
  web_trigger: *all-gates

feat/**:
  push:
    - *lint
  api_trigger: *all-gates
  web_trigger: *all-gates

# `auto/**` is where agent work lands (branch whitelist tokens are scoped to
# `auto/*`). It gets the same automatic `lint` gate on both push and
# pull_request: without the `pull_request` entry a PR from such a branch has no
# automatic check at all, and its PR status is reported as a failure even
# though no pipeline was scheduled for it.
auto/**:
  push:
    - *lint
  pull_request:
    - *lint
  api_trigger: *all-gates
  web_trigger: *all-gates
